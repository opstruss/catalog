name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

# Two releases at once would race to move the major tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The job pushes the major tag with the token of the workflow.
          persist-credentials: true
      # The notes are the CHANGELOG.md section of this version, written
      # "## [1.2.3] - 2026-11-02" once [Unreleased] became the release.
      - name: Extract release notes
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $1 == "##" && $2 == "[" version "]" {
              if ($3 != "-" || $4 !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) exit 1
              found = 1; next
            }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
      # vX names the latest release of its major version, so a fix to an
      # older release leaves it where it is.
      - name: Move the major tag
        run: |
          major=${GITHUB_REF_NAME%%.*}
          latest=$(git tag --list "$major.*.*" --sort=-v:refname | head -n 1)
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "$latest is later than $GITHUB_REF_NAME, so $major stays"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -f -a -m "$major" "$major" "$GITHUB_REF_NAME^{commit}"
          git push -f origin "refs/tags/$major"
