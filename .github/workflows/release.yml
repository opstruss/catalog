name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+

permissions:
  contents: read

# Two releases at once would race to move the major tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The job pushes the major tag with the token of the workflow.
          persist-credentials: true
      # The notes are the CHANGELOG.md section of this version, written
      # "## [1.2.3] - 2026-11-02" once [Unreleased] became the release, with
      # its links to packages pointing at this tag, then how to use it and a
      # link to the changes since the release before. A release candidate,
      # as v1.0.0-rc.1, gets the section [Unreleased] after an opening that
      # says what it is. GitHub breaks a line of the notes where the file
      # does, so CHANGELOG.md keeps a paragraph or an item on one line.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          final="${version%%-*}"
          major="${final%%.*}"
          rc=0
          case "$version" in *-*) rc=1 ;; esac
          # Blank lines are kept only between others, so the section starts
          # and ends with text.
          awk -v version="$version" -v rc="$rc" '
            rc && $1 == "##" && $2 == "[Unreleased]" { found = 1; next }
            !rc && $1 == "##" && $2 == "[" version "]" {
              if ($3 != "-" || $4 !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) exit 1
              found = 1; next
            }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found && !NF { blank++; next }
            found { if (printed) for (; blank; blank--) print ""; blank = 0; printed = 1; print }
          ' CHANGELOG.md > "$RUNNER_TEMP/section.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/section.md"
          # A release candidate is compared with the tag before it, and a
          # release with the release before it. git sorts v1.0.0-rc.1 after
          # v1.0.0 unless told that "-" starts a pre-release.
          previous=$(git -c versionsort.suffix=- tag --list 'v*.*.*' --sort=-v:refname |
            awk -v tag="$GITHUB_REF_NAME" -v rc="$rc" 'seen && (rc || !/-/) { print; exit } $0 == tag { seen = 1 }')
          fill() {
            sed -e "s/@version@/$version/g" -e "s/@final@/$final/g" -e "s/@major@/$major/g"
          }
          {
            if [ "$rc" = 1 ]; then
              fill <<'EOF'
          The catalog @version@ is a release candidate of @final@, published to be tried before the release. Until @final@, the packages that it adds or changes, their inputs, and their outputs may still change. Report what you find at https://github.com/opstruss/catalog/issues.

          EOF
            fi
            printf '## Release notes\n\n'
            sed -E "s#\]\((plugins|components)/#](https://github.com/opstruss/catalog/tree/$GITHUB_REF_NAME/\1/#g" "$RUNNER_TEMP/section.md"
            if [ "$rc" = 1 ]; then
              fill <<'EOF'

          ## Use

          ```yaml
          uses:
            ops: github.com/opstruss/catalog@v@version@
          ```

          `opstruss.lock` pins the commit of this release candidate. [Versions](https://github.com/opstruss/catalog#versions) says what `@v@major@` names.
          EOF
            else
              fill <<'EOF'

          ## Use

          ```yaml
          uses:
            ops: github.com/opstruss/catalog@v@major@
          ```

          `@v@major@` names the latest @major@.x release, and `opstruss.lock` pins its commit until `opstruss uses update` moves it; `@v@version@` names this release only.
          EOF
            fi
            if [ -n "$previous" ]; then
              printf '\n**Full Changelog**: https://github.com/opstruss/catalog/compare/%s...%s\n' "$previous" "$GITHUB_REF_NAME"
            fi
          } > "$RUNNER_TEMP/notes.md"
      # A release candidate is a pre-release, which GitHub never marks as
      # the latest release.
      - name: Publish the release
        run: |
          case "$GITHUB_REF_NAME" in
          *-*) set -- --prerelease ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "$@"
        env:
          GH_TOKEN: ${{ github.token }}
      # vX names the latest release of its major version, so a fix to an
      # older release leaves it where it is. Before the first release of a
      # major version, it names the latest release candidate, since the
      # docs and opstruss init write @v1 then. git sorts a release
      # candidate after its release, so the latest release is looked for
      # among the releases alone.
      - name: Move the major tag
        run: |
          major=${GITHUB_REF_NAME%%.*}
          release=$(git tag --list "$major.*.*" --sort=-v:refname | awk '!/-/ && !found { print; found = 1 }')
          case "$GITHUB_REF_NAME" in
          *-*)
            if [ -n "$release" ]; then
              echo "$major names the release $release, so it stays"
              exit 0
            fi
            latest=$(git tag --list "$major.*.*-*" --sort=-v:refname | head -n 1)
            ;;
          *) latest=$release ;;
          esac
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "$latest is later than $GITHUB_REF_NAME, so $major stays"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -f -a -m "$major" "$major" "$GITHUB_REF_NAME^{commit}"
          git push -f origin "refs/tags/$major"
