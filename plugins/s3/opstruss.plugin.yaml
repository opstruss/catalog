name: s3
description: The state of OpsTruss in a bucket of Amazon S3, or of a storage that speaks S3 with conditional writes
opstruss: "1.1"
requires: [aws, jq]
env: [AWS_PROFILE, AWS_REGION]
inputs:
  bucket:
    type: string
    description: The bucket that keeps the state
    required: true
  prefix:
    type: string
    description: The prefix of the keys of the project in the bucket, such as platform/; each project has a prefix of its own
    default: ""
  region:
    type: string
    description: The region of the bucket; without it, that of the profile or of AWS_REGION
  endpoint:
    type: string
    description: The URL of a storage that speaks S3, in place of AWS, such as https://s3.example.internal
  access_key_id:
    type: string
    description: The access key, from a secret; without it, the credentials of the profile or of the environment of aws
    sensitive: true
  secret_access_key:
    type: string
    description: The secret of the access key, from a secret
    sensitive: true
  session_token:
    type: string
    description: The session token of temporary credentials, from a secret
    sensitive: true
backend:
  run: [./s3.sh]
